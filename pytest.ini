[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    asyncio: mark test as async
    slow: mark test as slow
    integration: mark test as integration test
asyncio_mode = auto

[coverage:run]
source = .
omit =
    tests/*
    venv/*
    .venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
