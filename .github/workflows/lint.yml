name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      # Версии black/isort/mypy берутся из requirements.txt, а не
      # ставятся отдельно неопинненными - раньше пин отсутствовал, и
      # разница версий (пример: black 24.1.1 локально/в манифесте
      # против 26.5.1, реально ставившегося в CI на момент проверки)
      # давала расхождение "проходит локально - красный CI" без
      # изменений кода. Найдено зональным аудитом хаба 2026-09-08
      # (В-15 отчёта).
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check with Black
      run: |
        black --check .

    - name: Check with Isort
      run: |
        isort --check-only .

    - name: Check with MyPy
      run: |
        mypy . --ignore-missing-imports
