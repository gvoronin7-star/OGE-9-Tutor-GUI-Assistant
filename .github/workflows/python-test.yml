name: Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      # Codecov-шаг раньше был без token: - Codecov отдавал ошибку в
      # каждом иначе зелёном прогоне, отчёт никуда не публиковался с
      # первого дня. Убран, а не снабжён токеном - секреты репозитория
      # добавляет владелец, не эта сессия. --cov-report=xml убран вместе
      # с ним - он был нужен только для загрузки в Codecov.
      # Найдено зональным аудитом хаба 2026-09-08 (В-15 отчёта).
      run: |
        pytest --cov=. --cov-report=term-missing
